<!DOCTYPE html>
<!-- Indica al navegador que el documento está escrito en HTML5
Es importante porque le dice cómo interpretar el código -->

<html lang="en">
    <!-- Es la etiqueta raíz, contiene todo el documento
lang="en" indica que el idioma es inglés
Si fuera español sería: lang="es" -->
<head>
    <!-- Contiene información interna de la página (no visible directamente)
Sirve para configurar el documento -->
    <meta charset="UTF-8">
    <!-- Define la codificación de caracteres
Permite usar tildes, ñ, símbolos, etc. -->
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página sea responsive
Es decir, que se vea bien en celulares, tablets y computadoras -->
    <title>Document</title>
    <!--Es el título de la página
Aparece en la pestaña del navegador  -->
</head>
<!-- Cierra la sección de configuración -->
<body>
    <!-- Aquí va todo lo visible de la página
Texto, imágenes, botones, etc. -->
    
</body>
<!--Cierra el contenido visible  -->
</html>
<!-- Cierra todo el documento -->
